apiVersion: v1
kind: ResourceQuota
metadata:
  name: {{ .Values.namespace }}-quota
  namespace: {{ .Values.namespace }}
spec:
  hard:
    requests.cpu: {{ .Values.quotas.requestsCpu | quote }}
    requests.memory: {{ .Values.quotas.requestsMemory | quote }}
    limits.cpu: {{ .Values.quotas.limitsCpu | quote }}
    limits.memory: {{ .Values.quotas.limitsMemory | quote }}
    pods: {{ .Values.quotas.pods | quote }}
