{{- if .Values.hpaTemplate.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Values.hpaTemplate.name }}
  namespace: {{ .Values.namespace }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Values.hpaTemplate.targetDeployment }}
  minReplicas: {{ .Values.hpaTemplate.minReplicas }}
  maxReplicas: {{ .Values.hpaTemplate.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.hpaTemplate.targetCpuUtilization }}
{{- end }}
