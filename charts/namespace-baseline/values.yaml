namespace: workload-test

quotas:
  requestsCpu: "4"
  requestsMemory: "8Gi"
  limitsCpu: "8"
  limitsMemory: "16Gi"
  pods: "20"

limits:
  defaultLimitCpu: "500m"
  defaultLimitMemory: "512Mi"
  defaultRequestCpu: "100m"
  defaultRequestMemory: "128Mi"

rbac:
  roleName: "workload-developer"
  bindingGroup: "developers-group"

networkPolicy:
  enabled: true

hpaTemplate:
  enabled: true
  name: "sample-workload-hpa"
  targetDeployment: "sample-workload"
  minReplicas: 2
  maxReplicas: 10
  targetCpuUtilization: 75
